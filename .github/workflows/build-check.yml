name: Check public/ matches src/
on:
  push:
    paths: ['src/**', 'public/**', 'build/**']
  pull_request:
    paths: ['src/**', 'public/**', 'build/**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build in memory and compare with public/
        working-directory: build
        run: npm ci && npm run check
